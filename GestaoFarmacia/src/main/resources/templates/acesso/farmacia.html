<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragmentos/layout :: layout(~{::title}, ~{::section})}">
<head><title>Área da farmácia · Gestão Farmácia</title></head>
<body>
<section>
    <div class="cabecalho-pagina"><div><h1>Área da farmácia</h1>
        <p class="subtitulo">Escolha a farmácia para gerenciar o catálogo de medicamentos.</p></div></div>
    <div class="vazio" th:if="${#lists.isEmpty(farmacias)}">
        Nenhuma farmácia cadastrada. <a th:href="@{/farmacias/nova}">Cadastrar farmácia</a>
    </div>
    <div class="grade grade-3" th:unless="${#lists.isEmpty(farmacias)}">
        <a class="cartao cartao-link" th:each="farmacia : ${farmacias}"
           th:href="@{/farmacias/{id}/medicamentos(id=${farmacia.id})}">
            <h2 th:text="${farmacia.nome}">Farmácia</h2>
            <p th:text="${farmacia.localizacao} ?: 'Localização não informada'">Localização</p>
        </a>
    </div>
</section>
</body>
</html>
