spring.application.name=GestaoFarmacia
server.port=8080

# Banco de dados PostgreSQL (ajuste por variaveis de ambiente) Local Windows
spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/gestaofarmacia}
spring.datasource.username=${BANCO_USUARIO:postgres}
spring.datasource.password=${BANCO_SENHA:postgres}

# =========================================================
# Banco de Dados PostgreSQL - HOSTINGER
# =========================================================
#spring.datasource.url= jdbc:postgresql://99.99.9.999:5432/gestaofarmacia}
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# Interface em português do Brasil
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
